[package]
name = "aws-quick-manager"
version = "0.1.2"
description = "Account manager and switcher for the Amazon Quick desktop app"
authors = ["httpdone"]
license = "MIT"
edition = "2024"
# tauri-plugin-updater needs Rust 1.90 or newer
rust-version = "1.90"
default-run = "aws-quick-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aws_quick_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sha1 = "0.10"
hex = "0.4.3"
dirs = "6.0.0"
thiserror = "2.0.20"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
url = "=2.5.8"
rand = "=0.10.3"
base64 = "0.23.1"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.6.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
